[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vlmux"
version = "0.1.0"
description = "A model-agnostic computer-use runtime for vision-language models."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "MohamedRF" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.28,<1",
  "mss>=10,<11",
  "pillow>=11,<13",
  "platformdirs>=4.3,<5",
  "pydantic>=2.10,<3",
  "pynput>=1.8,<2",
  "rich>=13.9,<15",
  "typer>=0.15,<1",
]

[project.urls]
Homepage = "https://github.com/MohamedRF/VLMux"
Repository = "https://github.com/MohamedRF/VLMux.git"
Issues = "https://github.com/MohamedRF/VLMux/issues"

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "types-pynput>=1.8,<2",
]

[project.scripts]
vlmux = "vlmux.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vlmux"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["vlmux"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = true
